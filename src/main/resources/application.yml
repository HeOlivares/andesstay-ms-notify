server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: andesstay-ms-notify
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

andesstay:
  notify:
    processed-event-ttl: ${PROCESSED_EVENT_TTL:PT24H}
    retry:
      max-attempts: ${NOTIFY_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${NOTIFY_RETRY_BACKOFF_MS:200}
    topology:
      exchanges:
        direct: cmd.direct
        topic: cmd.topic
        dead: cmd.dead.dlx
      queues:
        email: q.cmd.email
        housekeeping: q.cmd.housekeeping
        voucher: q.cmd.voucher
      routing-keys:
        email: email.send
        housekeeping: housekeeping.ticket
        voucher: voucher.gen
      topic-patterns:
        email: "email.*"
        housekeeping: "housekeeping.#"
        voucher: "voucher.*"
      dlq-suffix: ".dlq"
