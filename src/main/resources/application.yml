server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: andesstay-ms-notify
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:notify-activity}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: cl.duoc.andesstay.notify.activity
        spring.json.use.type.headers: false
        spring.json.value.default.type: cl.duoc.andesstay.notify.activity.ReservationActivity

andesstay:
  notify:
    kafka:
      activity-topic: reservations.activity
      activity-concurrency: 3
      max-attempts: 3
      backoff-ms: 200
    processed-event-ttl: ${PROCESSED_EVENT_TTL:PT24H}
    retry:
      max-attempts: ${NOTIFY_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${NOTIFY_RETRY_BACKOFF_MS:200}
    topology:
      exchanges:
        direct: cmd.direct
        topic: cmd.topic
        dead: cmd.dead.dlx
      queues:
        email: q.cmd.email
        housekeeping: q.cmd.housekeeping
        voucher: q.cmd.voucher
        cabin-ready: q.cmd.cabin.ready
      routing-keys:
        email: email.send
        housekeeping: housekeeping.ticket
        voucher: voucher.gen
        cabin-ready: cabin.ready
      topic-patterns:
        email: "email.*"
        housekeeping: "housekeeping.#"
        voucher: "voucher.*"
      dlq-suffix: ".dlq"
